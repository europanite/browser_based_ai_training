services:
  frontend_test:
    container_name: frontend_test
    build:
      context: ./frontend
      dockerfile: Dockerfile.test
    working_dir: /app
    environment:
      CI: "1"
      EXPO_TUNNEL: ${EXPO_TUNNEL}
      EXPO_DEVTOOLS_LISTEN_ADDRESS: ${EXPO_DEVTOOLS_LISTEN_ADDRESS}
      REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME}
      EXPO_PUBLIC_API_HOST: ${EXPO_PUBLIC_API_HOST}
      EXPO_PUBLIC_API_PORT: ${EXPO_PUBLIC_API_PORT}
      EXPO_PUBLIC_API_BASE: ${EXPO_PUBLIC_API_BASE}
      AI_TRAINING_DATA_DIR: /workspace/data
      AI_TRAINING_DATA_MANIFEST: /app/public/data_manifest.json
    volumes:
      - ./frontend/app:/app
      - /app/node_modules
      - ./data:/workspace/data:ro
      - ./data:/app/public/data:ro
      - ./scripts:/workspace/scripts:ro
      - ./reports/frontend:/reports/frontend
    command: >-
      sh -lc "node /workspace/scripts/prepare_public_data.js /workspace/data /app/public/data_manifest.json data --limit 100 && npm ci && npm test -- --ci --runInBand --verbose"

  frontend_model_validation:
    container_name: frontend_model_validation
    profiles: ["validation"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.test
    working_dir: /app
    environment:
      CI: "1"
      EXPO_TUNNEL: ${EXPO_TUNNEL}
      EXPO_DEVTOOLS_LISTEN_ADDRESS: ${EXPO_DEVTOOLS_LISTEN_ADDRESS}
      REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME}
      EXPO_PUBLIC_API_HOST: ${EXPO_PUBLIC_API_HOST}
      EXPO_PUBLIC_API_PORT: ${EXPO_PUBLIC_API_PORT}
      EXPO_PUBLIC_API_BASE: ${EXPO_PUBLIC_API_BASE}
      AI_TRAINING_DATA_DIR: /workspace/data
      AI_TRAINING_DATA_MANIFEST: /app/public/data_manifest.json
    volumes:
      - ./frontend/app:/app
      - /app/node_modules
      - ./data:/workspace/data:ro
      - ./data:/app/public/data:ro
      - ./scripts:/workspace/scripts:ro
      - ./reports/frontend:/reports/frontend
    command: >-
      sh -lc "node /workspace/scripts/prepare_public_data.js /workspace/data /app/public/data_manifest.json data --limit 100 && npm ci && npm test -- --ci --runInBand --verbose __tests__/bundledDataManifest.test.ts"
